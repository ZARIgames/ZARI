<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">

<title>Мой сервис</title>
<style>

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;max-width:560px;margin:0 auto;user-select:none;overflow:hidden}

#clk{position:absolute;left:8px;top:8px;background:#0007;color:#fff;font-weight:800;font-size:12px;padding:3px 9px;border-radius:10px;z-index:6}
.dec{position:absolute;font-size:28px;top:40px}
#door{position:absolute;left:50%;top:calc(62% - 84px);width:52px;height:84px;margin-left:-26px;background:linear-gradient(#7a4a22,#5a3515);border:4px solid #3d240e;border-bottom:0;border-radius:26px 26px 0 0/20px 20px 0 0;transition:background .3s,box-shadow .3s}
#door::before{content:"";position:absolute;left:11px;top:9px;width:22px;height:24px;border-radius:12px 12px 3px 3px;background:#bfe9ff}
#door::after{content:"";position:absolute;right:6px;top:50px;width:7px;height:7px;border-radius:50%;background:gold}
#door.open{background:linear-gradient(#ffe9a8,#ffcf5c);box-shadow:0 0 22px #ffe08a;z-index:4}
#cust{position:absolute;inset:0;z-index:4;pointer-events:none}
.c{position:absolute;width:calc(100%/var(--n,3));text-align:center;transform-origin:50% 100%;pointer-events:auto;transition:left 1.8s ease-in-out,bottom 1.8s ease-in-out,transform 1.8s ease-in-out,opacity .6s}
.bub{position:relative;background:#fff;color:#222;border-radius:12px;padding:3px 5px;font-size:19px;min-height:30px;box-shadow:0 2px 4px #0003;font-weight:700;opacity:0;transition:opacity .4s}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid #0000;border-top-color:#fff;border-bottom:0}
.bub sup{font-size:11px}.done{opacity:.35;text-decoration:line-through}
.face{font-size:44px;line-height:1.1;filter:drop-shadow(0 4px 3px #0006);animation:bob 1.8s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-3px)}}
.bar{height:6px;background:#0003;border-radius:3px;margin:2px 8px;opacity:0;transition:opacity .4s}.bar i{display:block;height:100%;border-radius:3px;background:#4caf50}
.c.here .bub,.c.here .bar{opacity:1}
.bd{position:relative;width:34px;height:44px;margin:-6px auto 0}
.c:not(.here) .bd{animation:step .3s infinite}@keyframes step{50%{margin-top:-9px}}
.bd .to{position:absolute;left:4px;right:4px;top:0;height:26px;border-radius:11px 11px 4px 4px;background:var(--sh,#4a90e2);box-shadow:inset 0 -5px 0 #0002}
.bd .ar{position:absolute;top:2px;width:7px;height:21px;border-radius:5px;background:var(--sh,#4a90e2)}.bd .ar.l{left:-1px}.bd .ar.r{right:-1px}
.bd .ar::after{content:"";position:absolute;left:0;bottom:-3px;width:7px;height:7px;border-radius:50%;background:#f1c27d}
.bd .lg{position:absolute;left:8px;right:8px;top:25px;height:19px;background:linear-gradient(90deg,var(--pn,#3b4a6b) 0 45%,#0000 45% 55%,var(--pn,#3b4a6b) 55%);text-decoration:none}
.c.sm .face{font-size:34px}.c.sm .bd{transform:scale(.78);transform-origin:50% 0;margin-bottom:-9px}
.crew .bub{font-size:12px}.crew .face{font-size:34px}
.mon .bd .to,.mon .bd .ar{background:#2b1b3d}.mon .bub{background:#e8d9ff}
.bum .bd .to,.bum .bd .ar{background:#7a6a55}.bum .bub{background:#fff3d6}
.thief .bd .to,.thief .bd .ar{background:#222}.thief .bub{background:#ddd}
.c.fin .bub{background:#c8f7c5}.c.fin .bar{opacity:0}
.mad .face{animation:shake .25s 4}.mad .bub{background:#ffb3b3}

#mach{position:absolute;left:10px;bottom:34px;width:54px;height:64px;background:linear-gradient(#b0443a,#7d2a24);border-radius:9px 9px 4px 4px;box-shadow:0 3px 0 #0006}
#mach::before{content:"";position:absolute;left:14px;right:14px;top:30px;height:26px;background:#2a1a14;border-radius:4px}
#mach i{position:absolute;right:6px;top:6px;width:9px;height:9px;border-radius:50%;background:#777}

#mach b{position:absolute;left:16px;top:-22px;font-size:20px;opacity:0}#mach.on b{opacity:1;animation:bob .6s infinite}

.cup{display:inline-block;min-width:36px;height:36px;border-radius:9px 9px 14px 14px;background:var(--mug,#fff);text-align:center;line-height:36px;font-size:22px;box-shadow:0 2px 0 #0004;padding:0 3px;color:#222}
#reg{position:absolute;left:50%;margin-left:4px;bottom:6px;width:46px;height:34px;background:linear-gradient(#6a6e76,#3c3f45);border-radius:7px 7px 3px 3px;box-shadow:0 2px 0 #0007}
#reg b{position:absolute;left:5px;right:5px;top:4px;height:13px;background:#9be28f;color:#0a3d0a;font:800 10px/13px monospace;text-align:right;padding-right:3px;border-radius:2px;overflow:hidden}
#reg i{position:absolute;left:3px;right:3px;bottom:-4px;height:8px;background:#222427;border-radius:0 0 5px 5px;transition:transform .2s}
#reg.open i{transform:translateY(7px);background:#2e7d32}#reg.open{box-shadow:0 0 12px #ffd54f}
#pos{position:absolute;right:12px;bottom:6px;width:30px;height:38px;background:linear-gradient(#34373d,#1b1d21);border-radius:6px 6px 3px 3px;box-shadow:0 2px 0 #0007}

#pos.ok{box-shadow:0 0 14px #69f0ae}#pos.ok b{background:#9be28f}

@keyframes pulse{to{background:#ff6f60}}

#pan{display:flex;gap:6px;overflow-x:auto;margin:8px 8px 0;padding-bottom:3px}
.pc{flex:none;border:2px solid transparent;background:var(--card);border-radius:12px;padding:3px 9px;text-align:center;font-weight:800;font-size:16px;box-shadow:0 3px 0 #0002;min-width:58px}

@keyframes pulse2{to{transform:scale(1.06)}}
#hs #pet{font-size:44px;bottom:6%;animation:wander 9s infinite ease-in-out}

.box{max-height:88vh;overflow-y:auto}

#dvb.bad{animation:shake .25s 3}#dvb.swap{animation:swp .7s}@keyframes swp{50%{transform:scale(1.07) rotate(3deg);filter:brightness(1.4)}}
.cv{position:absolute;inset:0;background:linear-gradient(135deg,#c9ced6,#9aa1ab);display:flex;align-items:center;justify-content:center;font-size:40px;transition:transform .5s}.cv.up{transform:translateY(-62%)}
.sw{position:absolute;bottom:14px;width:18px;height:18px;border-radius:50%;background:radial-gradient(#eee,#777);box-shadow:0 0 0 2px #0004;animation:pulse2 .8s infinite alternate}.sw.h{background:#444;animation:none;opacity:.7}
.cg{position:absolute;inset:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}

 var c={id:++uid,ty:o.ty,kind:o.kind,face:o.face,dev:o.dev,pc:Math.floor(Math.random()*7),is:o.is,pat:o.pat*(1+.08*S.up.pat),walk:1.8,slot:o.slot,st:"wait"};c.max=c.pat;

function fly(t,a,b,ms,cb){var sc=$("scene"),Rr=sc.getBoundingClientRect(),A=a.getBoundingClientRect(),B=b.getBoundingClientRect(),f=document.createElement("span");f.className="fly";f.style.fontSize="30px";f.textContent=t;sc.appendChild(f);
 var x0=A.left-Rr.left+A.width/2-15,y0=A.top-Rr.top+A.height/2-15,x1=B.left-Rr.left+B.width/2-15,y1=B.top-Rr.top+B.height/2-15;

 if(s===0||s===4){h='<div class="cv" style="opacity:.0"></div>';for(var i=0;i<2;i++){var pr=s===0?i<2-R.n:i<R.n;h+='<i class="sw'+(pr?'':' h')+'" data-k="x" style="left:'+(i?72:18)+'%"></i>'}h='<div class="cv" data-k="x">🍎</div>'+h.replace('<div class="cv" style="opacity:.0"></div>','')}
 else if(s===1||s===3)h='<div class="cv'+(s===3?' up':'')+'" data-k="x">🍎</div>';
 else{h='<div class="cg'+(R.is==="cln"?' wet':'')+'">';CP.forEach(function(p){h+='<div class="cp" data-k="'+p[0]+'">'+p[1]+'</div>'});h+='</div>'}
 $("dvb").innerHTML=h;var pcc=PC[c.pc||0];$("dvb").style.setProperty("--p1",pcc[0]);$("dvb").style.setProperty("--p2",pcc[1]);
 var need=(s===2&&R.is==="cln")?"🧴":STEPS[s].t;
 $("bhint").innerHTML="Клиент: «"+IS[c.is][2]+"»<br>Шаг "+(s+1)+"/5: возьми "+need+" и "+(s===2&&R.is==="cln"?"протри плату спиртом (4 касания)":STEPS[s].h);
 document.querySelectorAll("#tools button[data-t]").forEach(function(b){b.className=(R.tool===b.dataset.t?"on ":"")+(need===b.dataset.t?"hl":"")})}

 if(!R||R.lock)return;var s=R.s,need=(s===2&&R.is==="cln")?"🧴":STEPS[s].t;
 if(R.tool!==need){say("Нужен инструмент: "+need);beep(150,.15);return}

 if(R.n>=tot){if(s===2)S.pt.cln--;adv()}else rd()}

function sn(n){return n.replace("iPhone ","").replace("Pro Max","ПМ").replace("Max","Макс").replace("Pro","Про").replace("Plus","Плюс").replace("mini","мини")}
function burst(el,em,n){var sc=$("scene"),Rr=sc.getBoundingClientRect(),B=el.getBoundingClientRect(),cx=B.left-Rr.left+B.width/2,cy=B.top-Rr.top+B.height/2;n=n||8;for(var i=0;i<n;i++){var s=document.createElement("span");s.className="fly";s.style.fontSize="18px";s.textContent=pick(em);s.style.left=cx+"px";s.style.top=cy+"px";sc.appendChild(s);var a=Math.PI*2*i/n,d=50+Math.random()*40;s.animate([{transform:"translate(0,0) scale(.5)",opacity:1},{transform:"translate("+Math.cos(a)*d+"px,"+Math.sin(a)*d+"px) scale(1.3)",opacity:0}],{duration:700+Math.random()*300,easing:"ease-out",fill:"forwards"}).onfinish=(function(q){return function(){q.remove()}})(s)}}

function dawn(){cs.filter(function(c){return c.ty==="mon"&&c.st==="wait"}).forEach(function(c){c.paying=1;leave(c)});S.ph=0;S.t=0;S.day++;S.m+=100;theme();say("☀️ Утро! День "+S.day+" · бонус +100💰");hud();save()}

function sleep(a){if(slp)return;slp=1;var f=$("fade");f.style.opacity=1;setTimeout(function(){S.day++;if(a!==0)S.m+=50;slp=0;toShop();setTimeout(function(){f.style.opacity=0;say("☀️ Доброе утро! День "+S.day)},300)},1300)}

function homeLoop(){requestAnimationFrame(homeLoop);if(S.loc!=="h"||pause)return;var me=$("me");px=Math.max(3,Math.min(90,px+jx*.55));if(py>0||vy>0){vy-=.8;py+=vy;if(py<=0){py=0;vy=0}}me.style.left=px+"%";me.style.bottom="calc(8% + "+py+"px)";if(jx)me.style.transform="scaleX("+(jx>0?1:-1)+")";$("bs").style.display=px<26?"inline-block":"none";$("bk").style.display=px>62?"inline-block":"none"}
(function(){var j=$("joy"),k=$("jk"),on=0;function mv(e){var r=j.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/(r.width/2);x=Math.max(-1,Math.min(1,x));jx=Math.abs(x)<.15?0:x;k.style.transform="translateX("+x*40+"px)"}
 function up(){on=0;jx=0;k.style.transform=""}j.addEventListener("pointerdown",function(e){on=1;try{j.setPointerCapture(e.pointerId)}catch(x){}mv(e)});j.addEventListener("pointermove",function(e){if(on)mv(e)});j.addEventListener("pointerup",up);j.addEventListener("pointercancel",up)})();

function shop(){var st=$("pn").scrollTop,h='<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">🛒 Магазин</h3><button class="bt" onclick="$(\'pn\').style.display=\'none\'">✕</button></div><p>💰 '+S.m+'</p><h3>🧰 Детали и товары</h3>';
 for(var k in PT){var p=PT[k];if(S.lv<p[3])continue;var c=p[2]*3;h+='<div class="row"><span style="font-size:26px">'+p[0]+'</span><div><b>'+p[1]+'</b><br>Есть: '+S.pt[k]+'</div><button '+(S.m<c?'disabled':'')+' onclick="buy(\''+k+'\')">+3 · '+c+'💰</button></div>'}
 h+='<h3>⬆️ Улучшения</h3>';UPS.forEach(function(u){var l=S.up[u[0]],c=Math.round(u[4]*Math.pow(1.8,l));h+='<div class="row"><span style="font-size:26px">'+u[1]+'</span><div><b>'+u[2]+' · '+l+'/8</b><br>'+u[3]+'</div><button '+(l>=8||S.m<c?'disabled':'')+' onclick="buyUp(\''+u[0]+'\')">'+(l>=8?'MAX':c+'💰')+'</button></div>'});
 h+='<h3>❤️ Здоровье</h3><div class="row"><span style="font-size:26px">❤️</span><div><b>Сердечко</b><br>'+S.hp+' / 3</div><button '+(S.hp>=3||S.m<5000?'disabled':'')+' onclick="buyHp()">5000💰</button></div>';

 [["Стены","cw"],["Пол","cf"],["Стол","cc"]].forEach(function(q){h+='<div class="row"><div>'+q[0]+'</div><input type="color" value="'+S[q[1]]+'" oninput="S.'+q[1]+'=this.value;theme();save()"></div>'});

 h+='<h3>🐾 Питомцы для дома</h3>';PETS.forEach(function(p,i){var own=S.pets.indexOf(i)>=0;h+='<div class="row"><span style="font-size:30px">'+p[0]+'</span><div><b>'+p[1]+'</b></div><button '+(!own&&S.m<p[2]?'disabled':'')+' onclick="buyPet('+i+')">'+(S.pet===i?'✔ Дома':own?'Выбрать':p[2]+'💰')+'</button></div>'});
 $("pn").innerHTML=h;$("pn").scrollTop=st;$("nm").value=S.nm}

 if(S.loc==="h"&&!pause){S.ht+=.1;hmUI();if(S.ht>=120)sleep(0);return}
 if(pause||S.loc!=="s"||busy)return;var dt=.1;S.t+=dt;

 spawnT-=dt;if(spawnT<=0){spawn();spawnT=6+Math.random()*6}
 cs.slice().forEach(function(c){
  if(c.walk>0){c.walk-=dt;if(c.walk<=0)c.el.classList.add("here");return}
  if(c.st!=="wait"||c.paying)return;
  c.pat-=dt;var b=c.el.querySelector(".bar i");b.style.width=Math.max(0,c.pat/c.max*100)+"%";b.style.background=c.pat<c.max*.3?"#e53935":"#4caf50";
