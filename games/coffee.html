function goHome(msg){$("md").style.display="none";pause=0;clearCust();S.loc="h";homeMsg=msg;S.ht=0;$("gb").style.display="none";hmUI();$("home").style.display="flex";$("pn").style.display="none";save()}
function toShop(){S.loc="s";S.ph=0;S.t=0;spawnT=3;tab=0;$("home").style.display="none";theme();menu();hud();save()}
var slp=0;function sleep(a){if(slp)return;slp=1;var f=$("fade");f.style.opacity=1;setTimeout(function(){S.day++;if(a!==0)S.m+=50;slp=0;hud();toShop();setTimeout(function(){f.style.opacity=0;say("☀️ Доброе утро! День "+S.day)},300)},1300)}
var tvs=["🎬","🌊","⚽","🐱","🎵","🌄"];function tv(){$("tv").textContent=pick(tvs)+TVS[S.tvs];setTimeout(function(){$("tv").textContent=TVS[S.tvs]},1500)}
function openShop(){shop();$("pn").style.display="flex"}
function shop(){var st=$("pn").scrollTop;var h='<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">🛒 Магазин</h3><button class="bt" onclick="$(\'pn\').style.display=\'none\'">✕</button></div><p>💰 '+S.m+'</p><h3>📦 Продукты</h3>';
 for(var k in IL){if(S.lv<IL[k]){continue}var c=IN[k][2]*5;h+='<div class="row"><span style="font-size:26px">'+IN[k][0]+'</span><div><b>'+IN[k][1]+'</b><br>Есть: '+S.st[k]+'</div><button '+(S.m<c?'disabled':'')+' onclick="buy(\''+k+'\')">+5 · '+c+'💰</button></div>'}
 h+='<h3>⬆️ Улучшения</h3>';UPS.forEach(function(u){var l=S.up[u[0]],c=Math.round(u[4]*Math.pow(1.8,l));h+='<div class="row"><span style="font-size:26px">'+u[1]+'</span><div><b>'+u[2]+' · '+l+'/8</b><br>'+u[3]+'</div><button '+(l>=8||S.m<c?'disabled':'')+' onclick="buyUp(\''+u[0]+'\')">'+(l>=8?'MAX':c+'💰')+'</button></div>'});
 h+='<h3>❤️ Здоровье</h3><div class="row"><span style="font-size:26px">❤️</span><div><b>Сердечко</b><br>'+S.hp+' / 3</div><button '+(S.hp>=3||S.m<1067?'disabled':'')+' onclick="buyHp()">1067💰</button></div><h3>☕ Цвет кружек</h3>';
 MG.forEach(function(g,i){h+='<div class="row"><span class="cup" style="--mug:'+g[1]+'">☕</span><div><b>'+g[0]+'</b></div><button '+(!S.mugs[i]&&S.m<g[2]?'disabled':'')+' onclick="buyMug('+i+')">'+(S.mug===i?'✔':S.mugs[i]?'Выбрать':g[2]+'💰')+'</button></div>'});
 h+='<h3>🐾 Питомцы для дома</h3>';PETS.forEach(function(p,i){var own=S.pets.indexOf(i)>=0;h+='<div class="row"><span style="font-size:30px">'+p[0]+'</span><div><b>'+p[1]+'</b></div><button '+(!own&&S.m<p[2]?'disabled':'')+' onclick="buyPet('+i+')">'+(S.pet===i?'✔ Дома':own?'Выбрать':p[2]+'💰')+'</button></div>'});
 h+='<h3>🎨 Кофейня и дом</h3>';[["Стены кофейни","cw"],["Пол кофейни","cf"]].forEach(function(q){h+='<div class="row"><div>'+q[0]+'</div><input type="color" value="'+S[q[1]]+'" oninput="S.'+q[1]+'=this.value;theme();save()"></div>'});
 h+='<h3>🏷️ Оформление</h3><div class="row"><div>Название<br><input id="nm" maxlength="14" onchange="setNm(this.value)" style="width:100%;padding:6px;border-radius:8px;border:1px solid #0004"></div></div><div class="row"><div>Цвет стола</div><input type="color" value="'+S.cc+'" oninput="S.cc=this.value;theme();save()"></div><div class="row"><div>Декор (нажми, чтобы сменить)</div>'+S.dc.map(function(d,i){return '<button onclick="cyc('+i+')" style="font-size:22px">'+d+'</button>'}).join('')+'</div>';
 
 $("pn").innerHTML=h;$("pn").scrollTop=st;$("nm").value=S.nm}
var UPS=[["spd","⚙️","Быстрая кофемашина","−10% времени варки",150],["pat","⏳","Уютная атмосфера","+8% терпения гостей",120],["tip","💵","Банка для чаевых","+10% к оплате",180]];
function buyUp(k){var u=UPS.filter(function(x){return x[0]===k})[0],l=S.up[k],c=Math.round(u[4]*Math.pow(1.8,l));if(l>=8||S.m<c)return;S.m-=c;S.up[k]++;beep(900,.2,"triangle");hud();save();shop()}
function setNm(v){S.nm=(v||"КОФЕЙНЯ").slice(0,14);theme();save()}
var DL=["🪟","🖼️","🕐","🪴","🌵","🎈","⭐","🐈","🎀","🕯️","🌸","🎁"];
function cyc(i){S.dc[i]=DL[(DL.indexOf(S.dc[i])+1)%DL.length];theme();save();shop()}
function openSet(){if(pause||S.loc==="x")return;pause=1;setUI()}
function closeSet(){pause=0;$("md").style.display="none"}
function setUI(){$("md").innerHTML='<div class="box">⚙️ Настройки<br><button onclick="togMus()">'+(S.on?'🔊 Музыка: вкл':'🔇 Музыка: выкл')+'</button><br><small>Перенос прогресса на другое устройство</small><br><textarea id="code" rows="3" style="width:100%"></textarea><br><button onclick="exp()">📤 Получить код</button><button onclick="imp()">📥 Загрузить</button><br><button style="background:#c62828" onclick="askReset()">🗑 Сбросить данные</button><br><button class="tg" onclick="closeSet()">✕ Закрыть</button></div>';$("md").style.display="flex"}
function togMus(){S.on=S.on?0:1;save();setUI()}
function askReset(){$("md").innerHTML='<div class="box">⚠️ Точно сбросить весь прогресс?<br><small>Монеты, уровень, продукты и оформление будут удалены безвозвратно.</small><br><button style="background:#c62828" onclick="doReset()">Да, удалить всё</button><button class="tg" onclick="setUI()">Отмена</button></div>'}
function doReset(){clearCust();S=def();pause=0;crewP=0;rush=0;tab=0;spawnT=3;$("md").style.display="none";$("home").style.display="none";$("pn").style.display="none";theme();menu();hud();save();say("🗑 Прогресс сброшен")}
var homeMsg="";function hmUI(){var L=Math.max(0,120-S.ht);$("hm").textContent=homeMsg+" · 🌙 до утра "+Math.floor(L/60)+":"+("0"+Math.floor(L%60)).slice(-2)}
var TVS=["📺","🖥️","💻"],PETS=[["🐈","Кот",500],["🐕","Пёс",650],["🐇","Кролик",400],["🐹","Хомяк",300],["🦜","Попугай",700],["🐢","Черепаха",350],["🦊","Лисёнок",900]];
function petUI(){$("pet").textContent=S.pet>=0?PETS[S.pet][0]:""}
function petTap(){if(S.pet<0)return;var p=$("pet"),h=document.createElement("div");h.className="fl";h.textContent="❤️";h.style.left=p.offsetLeft+"px";h.style.top=(p.offsetTop-10)+"px";$("hs").appendChild(h);setTimeout(function(){h.remove()},1000);beep(760,.12,"triangle")}
function buyPet(i){if(S.pets.indexOf(i)<0){if(S.m<PETS[i][2])return;S.m-=PETS[i][2];S.pets.push(i)}S.pet=i;hud();save();theme();shop()}
function homeUI(){
 function cr(l,k){return '<div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:15px">'+l+'<input type="color" value="'+S[k]+'" oninput="S.'+k+'=this.value;theme();save()"></div>'}
 var h='<div class="box">🛋️ Обустроить дом'+cr("Обои","hw")+cr("Потолок","hc")+cr("Пол","hf")+'<div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:15px">Цвет кровати<input type="range" min="0" max="360" value="'+S.bh+'" oninput="S.bh=+this.value;theme();save()"></div><div style="margin:8px 0;font-size:15px">Телевизор<br>';
 TVS.forEach(function(t,i){h+='<button class="tg'+(S.tvs===i?' on':'')+'" onclick="S.tvs='+i+';theme();save();homeUI()" style="font-size:22px">'+t+'</button>'});
 h+='</div><div style="margin:8px 0;font-size:15px">Питомец<br><button class="tg'+(S.pet<0?' on':'')+'" onclick="S.pet=-1;theme();save();homeUI()">нет</button>';
 S.pets.forEach(function(i){h+='<button class="tg'+(S.pet===i?' on':'')+'" onclick="S.pet='+i+';theme();save();homeUI()" style="font-size:22px">'+PETS[i][0]+'</button>'});
 h+='<br><small>Новых питомцев можно купить в 🛒</small></div><button class="tg" onclick="$(\'md\').style.display=\'none\'">✕ Закрыть</button></div>';
 $("md").innerHTML=h;$("md").style.display="flex"}
function buy(k){var c=IN[k][2]*5;if(S.m<c)return;S.m-=c;S.st[k]+=5;beep(500,.1);hud();menu();save();shop()}
function buyHp(){if(S.hp>=3||S.m<1067)return;S.m-=1067;S.hp++;hud();save();shop()}
function buyMug(i){if(!S.mugs[i]){if(S.m<MG[i][2])return;S.m-=MG[i][2];S.mugs[i]=1}S.mug=i;hud();save();shop()}
function exp(){$("code").value=btoa(unescape(encodeURIComponent(JSON.stringify(S))))}
function imp(){try{var o=JSON.parse(decodeURIComponent(escape(atob($("code").value.trim()))));S=Object.assign(def(),o);S.st=Object.assign(def().st,o.st||{});save();location.reload()}catch(e){$("code").value="⚠️ Неверный код"}}

function tick(){
 if(S.loc==="h"&&!pause){S.ht+=.1;hmUI();if(S.ht>=120)sleep(0);return}if(pause||S.loc!=="s")return;var dt=.1;S.t+=dt;S.pl+=dt;
 if(!S.ph&&S.t>=180){ask();return}
 if(S.ph&&S.t>=120)dawn();
 if(S.pl>=180){S.pl=0;crewP=1}
 clk();sosUI();rushNext-=dt;if(rushNext<=0&&rush<=0&&!S.ph){rushNext=100+Math.random()*60;rush=18;say("⚡ Час пик! Гостей больше, оплата x1.5")}if(rush>0)rush-=dt;
 if(S.ret>0){S.ret-=dt;if(S.ret<=0){if(cs.length<3&&!S.ph){S.ret=-1;mk("bumret")}else S.ret=1}}
 spawnT-=dt*(rush>0?1.6:1);if(spawnT<=0){spawn();spawnT=7+Math.random()}
 cs.slice().forEach(function(c){
  if(c.walk>0){c.walk-=dt;if(c.walk<=0){c.el.classList.add("here");if(c.ret){c.ret=0;S.m+=1000;payAnim(c,1000);say("🙏 Бездомный вернул добро: +1000💰");hud()}}return}
  if(c.paying||c.done)return;
  if(c.crew&&Math.random()<.008){var f=c.el.querySelector(".face");f.textContent="😂";setTimeout(function(){f.textContent=c.face},900)}
  c.pat-=dt;var b=c.el.querySelector(".bar i");b.style.width=Math.max(0,c.pat/c.max*100)+"%";b.style.background=c.pat<c.max*.3?"#e53935":"#4caf50";
  if(c.pat<=0)anger(c)})}
document.addEventListener("visibilitychange",function(){if(document.hidden)save()});window.addEventListener("pagehide",save);
load();theme();
if(S.loc==="h"){$("home").style.display="flex";homeMsg="🏠 С возвращением!";$("gb").style.display="inline-block";hmUI()}
hud();menu();if(S.sv===0&&S.loc==="s")setTimeout(function(){say("☕ Нажми на кофе внизу, потом на покупателя")},1500);setInterval(tick,100);setInterval(save,3000);
</script></body></html>
